[workspace]
members = [
    "crates/config",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/api",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Forgebike Team"]

# ---------------------------------------------------------------------------
# Canonical dependency versions — each crate opts in with `dep.workspace = true`.
# ---------------------------------------------------------------------------
[workspace.dependencies]

# --- async runtime ----------------------------------------------------------
tokio = { version = "1", features = ["full"] }

# --- web --------------------------------------------------------------------
axum       = { version = "0.7", features = ["macros", "ws"] }
tower      = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "timeout"] }

# --- rate limiting ----------------------------------------------------------
tower_governor = "0.4"

# --- database ---------------------------------------------------------------
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }

# --- cache ------------------------------------------------------------------
deadpool-redis = { version = "0.14", features = ["rt_tokio_1"] }

# --- serialisation ----------------------------------------------------------
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# --- configuration ----------------------------------------------------------
config  = "0.14"
dotenvy = "0.15"

# --- auth -------------------------------------------------------------------
jsonwebtoken = "9"
argon2       = "0.5"

# --- logging / tracing -------------------------------------------------------
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- error handling ---------------------------------------------------------
thiserror = "1"
anyhow    = "1"

# --- validation -------------------------------------------------------------
validator = { version = "0.21", features = ["derive"] }

# --- async traits -----------------------------------------------------------
async-trait = "0.1"

# --- ids & time -------------------------------------------------------------
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# --- encoding ----------------------------------------------------------------
base64 = "0.22"

# --- internal workspace crates ----------------------------------------------
forgebike-config         = { path = "crates/config" }
forgebike-domain         = { path = "crates/domain" }
forgebike-application    = { path = "crates/application" }
forgebike-infrastructure = { path = "crates/infrastructure" }
forgebike-api            = { path = "crates/api" }

# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code    = "forbid"
unused_imports = "warn"
dead_code      = "warn"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
unwrap_used        = "allow"
expect_used        = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
