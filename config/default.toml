# ---------------------------------------------------------------------------
# Default configuration — committed, contains NO secrets.
#
# Override via env vars (APP__SECTION__KEY=value) or a local
# config/development.toml (gitignored).
#
# TWO COMMON LOCAL SETUPS:
#   A) Native Postgres on 5432 — use 127.0.0.1 to force TCP auth on Linux:
#      DATABASE_URL=postgres://postgres:password@127.0.0.1:5432/forgebike
#   B) Docker Compose Postgres — mapped to 5435:
#      DATABASE_URL=postgres://postgres:password@127.0.0.1:5435/forgebike
# ---------------------------------------------------------------------------

[server]
host = "0.0.0.0"
port = 8080

[database]
url             = "postgres://postgres:password@127.0.0.1:5432/forgebike"
max_connections = 10

[redis]
url = "redis://127.0.0.1:6379"

[app]
environment = "development"
log_level   = "info"

[rate_limit]
# Auth route rate limiting (per client IP).
# Raise burst_size in development / CI to avoid 429s during rapid test runs.
# Tighten both values in production.
burst_size = 5   # tokens available immediately
per_second  = 1  # tokens added per second

[external_apis]
# Override via APP__EXTERNAL_APIS__GOOGLE_PLACES_API_KEY etc. in production.
# Clients return an empty list when the key is blank — no error is raised.
google_places_api_key = ""
yelp_api_key          = ""
tripadvisor_api_key   = ""

[ai]
# Set APP__AI__OPENAI_API_KEY in production to enable AI features.
# When empty, sentiment analysis and reply drafts are disabled gracefully.
openai_api_key       = ""
model                = "gpt-4o-mini"
max_sentiment_tokens = 60
max_reply_tokens     = 300
max_content_tokens   = 600

[jwt]
# IMPORTANT: override APP__JWT__SECRET with a strong secret in production.
# Generate one with: openssl rand -hex 32
# This development default must never be used in production.
secret                     = "change-me-in-production-use-openssl-rand-hex-32"
access_token_expiry_secs   = 900      # 15 minutes
refresh_token_expiry_secs  = 604800   # 7 days

[email]
# Set APP__EMAIL__SMTP_HOST in production to enable email campaign delivery.
# When smtp_host is empty, the email client is disabled gracefully (same
# pattern as the OpenAI key for AI features).
smtp_host     = ""
smtp_port     = 587
smtp_username = ""
smtp_password = ""
from_address  = "noreply@forgebike.ai"
from_name     = "Forgebike"

[stripe]
# Set APP__STRIPE__WEBHOOK_SECRET in production (from Stripe dashboard).
# When empty, webhook verification is disabled (always accepts — dev only).
webhook_secret  = ""
price_id_growth = ""
price_id_scale  = ""

[admin]
# Shared secret for admin endpoints (X-Admin-Key header).
# Set APP__ADMIN__SECRET_KEY to a strong random value in production.
# When empty, admin endpoints return 403 for all requests.
secret_key = ""
