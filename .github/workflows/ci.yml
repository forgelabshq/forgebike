name: CI

on:
  push: # every branch
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # We use only runtime sqlx functions (sqlx::query_as, sqlx::query), not the
  # compile-time query! macros.  SQLX_OFFLINE=true therefore applies everywhere
  # — the compiler never needs a live database connection.  The migration step
  # and any future integration tests use the runtime DATABASE_URL directly.
  SQLX_OFFLINE: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Format, lint, and type-check  (fast, no services needed)
  # ---------------------------------------------------------------------------
  check:
    name: Check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + build artefacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo check
        run: cargo check --all-targets --all-features

  # ---------------------------------------------------------------------------
  # Job 2 — Compile the release binary
  # ---------------------------------------------------------------------------
  build:
    name: Release Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artefacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --bin forgebike

      - name: Upload binary artefact
        uses: actions/upload-artifact@v4
        with:
          name: forgebike-linux-x86_64
          path: target/release/forgebike
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3 — Full test suite with real PostgreSQL + Redis
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: forgebike_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/forgebike_test
      APP__REDIS__URL: redis://localhost:6379
      APP_ENV: development
      # Raise rate-limit burst so the test suite never hits 429s.
      APP__RATE_LIMIT__BURST_SIZE: "200"
      APP__RATE_LIMIT__PER_SECOND: "100"
      # Explicit psql credentials — prevents any postgres client from falling
      # back to the OS user (root on GitHub Actions runners).
      PGUSER: postgres
      PGPASSWORD: password
      PGHOST: localhost
      PGPORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Run database migrations
        run: sqlx migrate run

      - name: Run tests
        run: cargo nextest run --all-features

  # ---------------------------------------------------------------------------
  # Job 4 — Security audit
  # ---------------------------------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit dependencies
        run: cargo audit
