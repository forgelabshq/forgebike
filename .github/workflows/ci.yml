name: CI

# ---------------------------------------------------------------------------
# Trigger on every push to every branch, and on pull requests targeting
# main or develop.  This means you get feedback on feature branches without
# waiting for a PR or merge.
# ---------------------------------------------------------------------------
on:
  push: # all branches — no filter
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel any in-progress run for the same branch/PR the moment a newer
# commit is pushed, saving Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Format, lint, and type-check (fast, no database needed)
  #
  # SQLX_OFFLINE=true tells sqlx not to hit a live database when verifying
  # compile-time queries.  We don't use sqlx query macros yet (only the
  # runtime API), so this is a no-op today but keeps CI clean as the
  # codebase grows.
  # ---------------------------------------------------------------------------
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + build artefacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo check
        run: cargo check --all-targets --all-features

  # ---------------------------------------------------------------------------
  # Job 2 — Compile the release binary
  #
  # Catches issues (e.g. LTO warnings, conditional compilation) that only
  # surface in --release mode and aren't caught by `cargo check`.
  # Runs in parallel with the test job.
  # ---------------------------------------------------------------------------
  build:
    name: Release Build
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artefacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --bin forgebike

      - name: Upload binary artefact
        uses: actions/upload-artifact@v4
        with:
          name: forgebike-linux-x86_64
          path: target/release/forgebike
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3 — Full test suite with real PostgreSQL + Redis
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: forgebike_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SQLX_OFFLINE: "false"
      DATABASE_URL: postgres://postgres:password@localhost:5432/forgebike_test
      APP__REDIS__URL: redis://localhost:6379
      APP_ENV: development
      # Use a generous rate-limit so the test suite never hits 429s.
      APP__RATE_LIMIT__BURST_SIZE: "200"
      APP__RATE_LIMIT__PER_SECOND: "100"

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Run database migrations
        run: sqlx migrate run --database-url postgres://postgres:password@localhost:5432/forgebike_test

      - name: Run tests
        run: cargo nextest run --all-features

  # ---------------------------------------------------------------------------
  # Job 4 — Security audit (fast, runs in parallel)
  # ---------------------------------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit dependencies
        run: cargo audit
